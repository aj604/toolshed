# doc-bloat — weekly documentation bloat sweep (plan → chunked detect → assemble → propose).
# Installed by the doc-lifecycle plugin's `scheduling-doc-sync` skill; re-run that skill to
# upgrade this file. Sibling to doc-sync.yml (drift): bloat is detect-and-propose only —
# fixing-doc-bloat applies a human-approved subset, so each lane opens a DRAFT PR and the
# merge is the approval.
# Orchestration is deterministic: plan-chunks.py plans bounded chunks (no model) with
# content-addressed ids and per-chunk turn budgets, resuming past any prior run's checkpoint
# artifacts; each sweep invocation gets its slice verbatim via --emit-prompt; a failed attempt
# is classified (sync-gate.py bloat-retry: budget exhaustion escalates the cap, anything else
# retries fresh); assembly tolerates gaps (--allow-partial) and records them as the report's
# "unswept" list, rendered as a loud PR-body banner — a twice-failed chunk costs its own docs,
# never the report, and the next sweep picks it up automatically. GitHub caps a matrix at 256
# jobs; on a corpus that plans past that, set chunking.max_chunks (audit-scope.json) and sweep
# in resumed passes. The distill apply lane fans out the same way (see the distill_plan
# comment below).
# The model holds no repository write authority: every job that invokes a model runs
# read-only, with the checkout's credential dropped, and hands its work forward as an
# artifact. The two credentialed jobs (prune_land, distill_merge) run no model — they
# authorize every path the model's patches name against the report (authorize-paths.py)
# and stage exactly those, never `git add -A`.
# Design: docs/plans/2026-07-06-detecting-doc-bloat-rearchitecture-design.md
# + docs/plans/2026-07-07-bloat-scale-hardening-design.md
# + docs/plans/2026-07-09-bloat-distill-lane-fanout-design.md in aj604/toolshed.
name: doc-bloat

on:
  schedule:
    - cron: "{{BLOAT_CRON}}"
  workflow_dispatch: {}

# Least privilege by default; each job widens only what it needs.
permissions:
  contents: read

concurrency:
  group: doc-bloat
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read     # resume step reads prior runs (gh run list/download) — 403s without it
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      decision: ${{ steps.pre.outputs.decision }}
      pending: ${{ steps.chunks.outputs.pending }}
      prune_pr: ${{ steps.facts.outputs.prune_pr }}
      distill_pr: ${{ steps.facts.outputs.distill_pr }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Gather facts
        id: facts
        run: |
          set -euo pipefail
          PRUNE_PR=$(gh pr list --head doc-bloat/prune --state open --json number --jq length)
          DISTILL_PR=$(gh pr list --head doc-bloat/distill --state open --json number --jq length)
          {
            echo "prune_pr=${PRUNE_PR}"
            echo "distill_pr=${DISTILL_PR}"
          } >> "$GITHUB_OUTPUT"
      - name: Growth backlog (docs/doc-scope.md)
        # The grow-loop's weekly surface — renders on every run, skip paths
        # included, so deferred docs are seen at the same cadence as bloat.
        run: python3 .github/doc-sync/render-report.py growth-backlog --scope-file docs/doc-scope.md
      - name: Gate (pre-sweep)
        id: pre
        run: |
          set -euo pipefail
          DECISION=$(python3 .github/doc-sync/sync-gate.py bloat-pre \
            --prune-pr-open "${{ steps.facts.outputs.prune_pr }}" \
            --distill-pr-open "${{ steps.facts.outputs.distill_pr }}")
          echo "decision=${DECISION}" >> "$GITHUB_OUTPUT"
          python3 .github/doc-sync/render-report.py bloat-pre-summary --decision "${DECISION}"
      - name: Fetch prior chunk results (resume)
        if: steps.pre.outputs.decision == 'detect'
        run: |
          set -euo pipefail
          mkdir -p chunks
          # Best-effort optimization: a failed lookup degrades to a fresh sweep, never a failed run.
          PREV=$(gh run list --workflow doc-bloat --status completed --limit 1 \
            --json databaseId --jq '.[0].databaseId // empty' || true)
          if [ -n "${PREV}" ]; then
            gh run download "${PREV}" --pattern 'bloat-chunk*' --dir prior || true
            find prior -name '*.json' -exec cp {} chunks/ \; 2>/dev/null || true
          fi
          echo "carried $(ls chunks | wc -l) prior chunk result(s); content-addressed ids drop any whose docs changed"
      - name: Plan chunks (deterministic — no model)
        if: steps.pre.outputs.decision == 'detect'
        id: chunks
        run: |
          set -euo pipefail
          python3 .github/doc-sync/plan-chunks.py --out manifest.json --results-dir chunks
          echo "pending=$(python3 -c 'import json; print(json.dumps(json.load(open("manifest.json"))["pending"]))')" >> "$GITHUB_OUTPUT"
      - name: Upload manifest
        if: steps.pre.outputs.decision == 'detect'
        uses: actions/upload-artifact@v4
        with:
          name: bloat-manifest
          path: manifest.json
      - name: Upload carried results (so assemble sees prior + new)
        if: steps.pre.outputs.decision == 'detect'
        uses: actions/upload-artifact@v4
        with:
          name: bloat-chunks-carried
          path: chunks/
          if-no-files-found: ignore

  # Read-only model job: each chunk's findings leave as an artifact.
  sweep:
    needs: plan
    if: needs.plan.outputs.decision == 'detect' && needs.plan.outputs.pending != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # claude-code-action OAuth exchange only — not repo write
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJson(needs.plan.outputs.pending) }}
    env:
      CHUNK_ID: ${{ matrix.chunk }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false   # no write-capable credential in a model job
      - uses: actions/download-artifact@v4
        with:
          name: bloat-manifest
      - name: Render dispatch payload (slice verbatim, planner-computed budget)
        id: slice
        run: |
          set -euo pipefail
          echo "turns=$(python3 .github/doc-sync/plan-chunks.py --emit-turns "${CHUNK_ID}" --manifest manifest.json)" >> "$GITHUB_OUTPUT"
          {
            echo "prompt<<BLOAT_PROMPT_EOF"
            python3 .github/doc-sync/plan-chunks.py --emit-prompt "${CHUNK_ID}" --manifest manifest.json
            echo "BLOAT_PROMPT_EOF"
          } >> "$GITHUB_OUTPUT"
      # Pin the marketplace to the installed release, read from the lockfile at runtime
      # so this file stays version-agnostic (see doc-sync.yml's Pin step for the full
      # rationale). claude-code-action rejects a `…/toolshed.git#v<version>` URL ref-pin,
      # so clone the tag to a local path under RUNNER_TEMP, outside the work tree.
      - name: Pin plugin marketplace
        run: |
          set -euo pipefail
          VERSION=$(cat .github/doc-sync/installed-version)
          rm -rf "${RUNNER_TEMP}/toolshed-marketplace"
          git clone --depth 1 --branch "v${VERSION}" \
            https://github.com/aj604/toolshed.git "${RUNNER_TEMP}/toolshed-marketplace"
      - name: Detect chunk (attempt 1)
        id: attempt1
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: ${{ runner.temp }}/toolshed-marketplace
          plugins: doc-lifecycle@toolshed
          prompt: ${{ steps.slice.outputs.prompt }}
          claude_args: --max-turns ${{ steps.slice.outputs.turns }} --allowedTools "Skill,Read,Grep,Glob,Write,Bash(git *),Bash(python3 *)"
      - name: Seam-validate (attempt 1)
        id: seam1
        continue-on-error: true
        run: python3 .github/doc-sync/validate-bloat-output.py --chunk "chunks/${CHUNK_ID}.json" --manifest manifest.json
      - name: Classify failure (budget-shaped escalates; anything else retries fresh)
        if: steps.seam1.outcome != 'success'
        id: retry
        run: |
          set -euo pipefail
          rm -f "chunks/${CHUNK_ID}.json"
          python3 .github/doc-sync/sync-gate.py bloat-retry \
            --execution-log "${{ steps.attempt1.outputs.execution_file || '/home/runner/work/_temp/claude-execution-output.json' }}" \
            --turns "${{ steps.slice.outputs.turns }}" >> "$GITHUB_OUTPUT"
      - name: Detect chunk (retry — fresh dispatch)
        if: steps.seam1.outcome != 'success'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: ${{ runner.temp }}/toolshed-marketplace
          plugins: doc-lifecycle@toolshed
          prompt: ${{ steps.slice.outputs.prompt }}
          claude_args: --max-turns ${{ steps.retry.outputs.turns }} --allowedTools "Skill,Read,Grep,Glob,Write,Bash(git *),Bash(python3 *)"
      - name: Seam-validate (final)
        # !cancelled(): must run even when the retry action died hard (the
        # implicit success() would skip it), or the always() upload ships the
        # dead attempt's partially-written chunk file.
        if: ${{ !cancelled() && steps.seam1.outcome == 'failure' }}
        run: |
          # On double failure, discard the invalid result BEFORE exiting: a leftover
          # invalid file would upload, fail the gap-tolerant assembly (which only
          # tolerates MISSING chunks), and mask the chunk as done on the next resume.
          python3 .github/doc-sync/validate-bloat-output.py --chunk "chunks/${CHUNK_ID}.json" --manifest manifest.json \
            || { rm -f "chunks/${CHUNK_ID}.json"; echo "::error::chunk ${CHUNK_ID} failed twice — its docs go to the report's unswept banner and the next sweep resumes them; every valid chunk is preserved as an artifact"; exit 1; }
      - name: Upload chunk result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bloat-chunk-${{ matrix.chunk }}
          path: chunks/${{ matrix.chunk }}.json
          if-no-files-found: ignore

  assemble:
    needs: [plan, sweep]
    # No pending-empty guard here (sweep keeps it): a fully-resumed run — every
    # chunk carried from the prior run's artifacts — must still assemble, gate,
    # and open lanes, or the carried state silently self-perpetuates forever.
    if: always() && needs.plan.outputs.decision == 'detect'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      prune: ${{ steps.prune.outputs.decision }}
      distill: ${{ steps.distill.outputs.decision }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: bloat-manifest
      - uses: actions/download-artifact@v4
        with:
          pattern: bloat-chunk*
          path: chunks
          merge-multiple: true
      - name: Assemble report (tolerates gaps — unswept chunks are recorded, never silent)
        run: python3 .github/doc-sync/validate-bloat-output.py --assemble chunks --manifest manifest.json --out bloat-report.json --allow-partial
      - name: Surface unswept gaps on the run summary
        run: python3 .github/doc-sync/render-report.py bloat-unswept-summary --report bloat-report.json
      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bloat-report
          path: bloat-report.json
          if-no-files-found: ignore
      - name: Gate (prune lane)
        id: prune
        run: |
          set -euo pipefail
          DECISION=$(python3 .github/doc-sync/sync-gate.py bloat-lane \
            --report bloat-report.json --lane prune \
            --pr-open "${{ needs.plan.outputs.prune_pr }}" \
            --out "$RUNNER_TEMP/prune.json")
          echo "decision=${DECISION}" >> "$GITHUB_OUTPUT"
          if [ "${DECISION}" != "open" ]; then
            python3 .github/doc-sync/render-report.py bloat-skip-summary --lane prune --reason "${DECISION}"
          fi
      - name: Gate (distill lane)
        id: distill
        run: |
          set -euo pipefail
          DECISION=$(python3 .github/doc-sync/sync-gate.py bloat-lane \
            --report bloat-report.json --lane distill \
            --pr-open "${{ needs.plan.outputs.distill_pr }}" \
            --out "$RUNNER_TEMP/distill.json")
          echo "decision=${DECISION}" >> "$GITHUB_OUTPUT"
          if [ "${DECISION}" != "open" ]; then
            python3 .github/doc-sync/render-report.py bloat-skip-summary --lane distill --reason "${DECISION}"
          fi

  # Read-only model job: the prune edits leave as a patch artifact, never as a push.
  prune:
    needs: [plan, assemble]
    if: needs.assemble.outputs.prune == 'open'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: bloat-report
      # Pin the marketplace to the installed release, read from the lockfile at runtime
      # so this file stays version-agnostic (see doc-sync.yml's Pin step for the full
      # rationale). claude-code-action rejects a `…/toolshed.git#v<version>` URL ref-pin,
      # so clone the tag to a local path under RUNNER_TEMP, outside the work tree.
      - name: Pin plugin marketplace
        run: |
          set -euo pipefail
          VERSION=$(cat .github/doc-sync/installed-version)
          rm -rf "${RUNNER_TEMP}/toolshed-marketplace"
          git clone --depth 1 --branch "v${VERSION}" \
            https://github.com/aj604/toolshed.git "${RUNNER_TEMP}/toolshed-marketplace"
      - name: Apply (headless)
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: ${{ runner.temp }}/toolshed-marketplace
          plugins: doc-lifecycle@toolshed
          prompt: >-
            Use the doc-lifecycle:fixing-doc-bloat skill to apply EVERY record in
            bloat-report.json whose verdict is CUT, CONDENSE, or EXTRACT-AND-MOVE — treat
            exactly those record IDs as the approved subset, and apply nothing else. Follow
            the skill's rules exactly. Edit files in place only — never commit, push, or
            open a PR; the workflow transports your edits.
          claude_args: --allowedTools "Read,Grep,Glob,Edit,Write,Bash(git *),Bash(python3 *)"
      - name: Export the edit set (artifact only — this job cannot write to the repo)
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/edits"
          # The report is a build artifact, never repo content. The export below is
          # deliberately total — anything else this run touched rides along, so the
          # land job rejects it loudly instead of silently dropping it.
          rm -f bloat-report.json
          git add -A
          # --no-renames: a rename record reports only its destination path to the
          # authority check, leaving the source unexamined.
          git diff --cached --binary --no-renames > "${RUNNER_TEMP}/edits/edits.patch"
          echo "exported edit set:"
          git diff --cached --name-only --no-renames
      - name: Upload edit set
        uses: actions/upload-artifact@v4
        with:
          name: bloat-prune-edits
          path: ${{ runner.temp }}/edits/edits.patch

  # Credentialed, model-free: authorize the prune patch against the report, stage
  # exactly the paths it named, open the draft PR.
  prune_land:
    needs: [plan, assemble, prune]
    if: needs.assemble.outputs.prune == 'open'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bloat-report
      - uses: actions/download-artifact@v4
        with:
          name: bloat-prune-edits
          path: ${{ runner.temp }}/edits
      # The report is the authority: a prune edit may touch the docs its records
      # name (and an EXTRACT-AND-MOVE target), nothing else. Checked before
      # anything is applied, so a violation ends the run with no PR and no staged
      # changes.
      - name: Authorize the edit set against the report
        run: |
          set -euo pipefail
          python3 .github/doc-sync/authorize-paths.py expected \
            --report bloat-report.json --lane prune \
            --out "$RUNNER_TEMP/expected-paths.json"
          python3 .github/doc-sync/authorize-paths.py check \
            --expected "$RUNNER_TEMP/expected-paths.json" \
            --patch "$RUNNER_TEMP/edits/edits.patch" --repo . \
            > "$RUNNER_TEMP/authorized-paths.txt"
      - name: Open draft PR
        run: |
          set -euo pipefail
          DATE=$(date -u +%F)
          python3 .github/doc-sync/sync-gate.py bloat-lane \
            --report bloat-report.json --lane prune --pr-open 0 \
            --out "$RUNNER_TEMP/lane.json" >/dev/null
          rm -f bloat-report.json
          python3 .github/doc-sync/render-report.py bloat-pr-body \
            --report "$RUNNER_TEMP/lane.json" > "$RUNNER_TEMP/body.md"
          TITLE=$(python3 .github/doc-sync/render-report.py bloat-pr-title \
            --report "$RUNNER_TEMP/lane.json" --lane prune --date "${DATE}")
          # An empty authorized list means the sweep produced no diff — skip cleanly
          # rather than opening an empty PR.
          if [ ! -s "$RUNNER_TEMP/authorized-paths.txt" ]; then
            python3 .github/doc-sync/render-report.py bloat-skip-summary --lane prune --reason skip-noop
            exit 0
          fi
          git config user.name "doc-bloat"
          git config user.email "doc-bloat@users.noreply.github.com"
          git checkout -b doc-bloat/prune
          git apply "$RUNNER_TEMP/edits/edits.patch"
          # Explicit path-list staging — never `git add -A`: the list is what the
          # report authorized and the check above re-derived from the patch.
          git add --pathspec-from-file="$RUNNER_TEMP/authorized-paths.txt"
          git commit -m "docs: bloat prune sweep (${DATE})"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" doc-bloat/prune
          PR_URL=$(gh pr create --draft \
            --title "${TITLE}" \
            --body-file "$RUNNER_TEMP/body.md" \
            --head doc-bloat/prune \
            --base "${{ github.ref_name }}")
          python3 .github/doc-sync/render-report.py bloat-pr-summary \
            --report "$RUNNER_TEMP/lane.json" --lane prune --pr-url "${PR_URL}"

  # The distill lane fans out like the sweep: plan-distill.py plans bounded record
  # groups (no model — DISTILL records grouped by artifact directory so same-target
  # residue rides one executor, mechanical verdicts in one inline group); each group
  # runs as its own matrix invocation with its slice rendered via --emit-prompt and
  # NO turn cap (an apply invocation is never truncated mid-judgment — the kill-switch
  # is the job timeout); a deterministic merge job authorizes every path the group
  # patches name, lands each group's format-patch series (docs/decisions.md append
  # conflicts union-resolved; anything else skips that record loudly) and opens the
  # one draft PR. There is deliberately no cross-run patch resume: an unapplied
  # record's artifact survives, so the next sweep re-proposes it — convergence is
  # re-detection.
  # Design: docs/plans/2026-07-09-bloat-distill-lane-fanout-design.md in aj604/toolshed.
  distill_plan:
    needs: [plan, assemble]
    if: needs.assemble.outputs.distill == 'open'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      pending: ${{ steps.groups.outputs.pending }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: bloat-report
      - name: Plan distill groups (deterministic — no model)
        id: groups
        run: |
          set -euo pipefail
          python3 .github/doc-sync/plan-distill.py --report bloat-report.json --out distill-manifest.json
          echo "pending=$(python3 -c 'import json; print(json.dumps(json.load(open("distill-manifest.json"))["pending"]))')" >> "$GITHUB_OUTPUT"
      - name: Upload distill manifest
        uses: actions/upload-artifact@v4
        with:
          name: distill-manifest
          path: distill-manifest.json

  # Read-only model job: each group's per-record commits leave as a patch series.
  distill_sweep:
    needs: distill_plan
    if: needs.distill_plan.outputs.pending != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    # Wall-clock kill-switch for a hung invocation — a bound on hangs, not on care;
    # there is no --max-turns on apply invocations by design.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJson(needs.distill_plan.outputs.pending) }}
    env:
      GROUP_ID: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false   # local commits only; nothing to push with
      - uses: actions/download-artifact@v4
        with:
          name: distill-manifest
      - uses: actions/download-artifact@v4
        with:
          name: bloat-report
      - name: Render dispatch payload (slice verbatim)
        id: slice
        run: |
          set -euo pipefail
          git config user.name "doc-bloat"
          git config user.email "doc-bloat@users.noreply.github.com"
          {
            echo "prompt<<DISTILL_PROMPT_EOF"
            python3 .github/doc-sync/plan-distill.py --emit-prompt "${GROUP_ID}" --manifest distill-manifest.json
            echo "DISTILL_PROMPT_EOF"
          } >> "$GITHUB_OUTPUT"
      # Pin the marketplace to the installed release, read from the lockfile at runtime
      # so this file stays version-agnostic (see doc-sync.yml's Pin step for the full
      # rationale). claude-code-action rejects a `…/toolshed.git#v<version>` URL ref-pin,
      # so clone the tag to a local path under RUNNER_TEMP, outside the work tree.
      - name: Pin plugin marketplace
        run: |
          set -euo pipefail
          VERSION=$(cat .github/doc-sync/installed-version)
          rm -rf "${RUNNER_TEMP}/toolshed-marketplace"
          git clone --depth 1 --branch "v${VERSION}" \
            https://github.com/aj604/toolshed.git "${RUNNER_TEMP}/toolshed-marketplace"
      - name: Apply group (attempt 1)
        id: attempt1
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: ${{ runner.temp }}/toolshed-marketplace
          plugins: doc-lifecycle@toolshed
          prompt: ${{ steps.slice.outputs.prompt }}
          claude_args: --allowedTools "Skill,Task,Read,Grep,Glob,Edit,Write,Bash(git *),Bash(python3 *)"
      - name: Seam-validate (attempt 1)
        id: seam1
        continue-on-error: true
        run: python3 .github/doc-sync/plan-distill.py --validate-result "distill-results/${GROUP_ID}.json" --manifest distill-manifest.json
      - name: Reset for fresh retry
        if: steps.seam1.outcome != 'success'
        run: |
          set -euo pipefail
          git reset --hard "${{ github.sha }}"
          git clean -fd -e bloat-report.json -e distill-manifest.json
          rm -f "distill-results/${GROUP_ID}.json"
      - name: Apply group (retry — fresh dispatch)
        if: steps.seam1.outcome != 'success'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: ${{ runner.temp }}/toolshed-marketplace
          plugins: doc-lifecycle@toolshed
          prompt: ${{ steps.slice.outputs.prompt }}
          claude_args: --allowedTools "Skill,Task,Read,Grep,Glob,Edit,Write,Bash(git *),Bash(python3 *)"
      - name: Seam-validate (final)
        if: steps.seam1.outcome != 'success'
        run: |
          # On double failure, discard the invalid result BEFORE exiting: the merge job
          # drops a group without a valid sidecar, so a leftover invalid file must not
          # ride into the artifacts looking like a result.
          python3 .github/doc-sync/plan-distill.py --validate-result "distill-results/${GROUP_ID}.json" --manifest distill-manifest.json \
            || { rm -f "distill-results/${GROUP_ID}.json"; echo "::error::group ${GROUP_ID} failed twice — its records go to the PR's not-landed banner and the next sweep re-proposes them"; exit 1; }
      - name: Export patch series
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "patches/${GROUP_ID}" distill-results
          if [ -f "distill-results/${GROUP_ID}.json" ]; then
            # --no-renames: a rename record reports only its destination path to the
            # merge job's authority check, leaving the source unexamined.
            git format-patch "${{ github.sha }}..HEAD" --no-renames -o "patches/${GROUP_ID}"
          fi
      - name: Upload group result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: distill-group-${{ matrix.group }}
          path: |
            patches/${{ matrix.group }}/
            distill-results/${{ matrix.group }}.json
          if-no-files-found: ignore

  # Credentialed, model-free: authorize the group patches against the report, land
  # them deterministically, open the one draft PR.
  distill_merge:
    needs: [plan, assemble, distill_plan, distill_sweep]
    # No success guard on distill_sweep: a twice-failed group costs its own
    # records (dropped by the merge, bannered in the PR), never the lane.
    if: always() && needs.assemble.outputs.distill == 'open'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: distill-manifest
      - uses: actions/download-artifact@v4
        with:
          name: bloat-report
      - uses: actions/download-artifact@v4
        with:
          pattern: distill-group-*
          merge-multiple: true
      # The distiller chooses where residue lands and which inbound references it
      # repoints, so the authority is the audited documentation scope plus the
      # records' own docs — enforced over every patch before a single one is
      # applied. A patch reaching outside it ends the lane with no PR.
      # This lane transports per-record commits, not a working-tree diff (the PR
      # has to stay reviewable record by record), so it cannot stage by pathspec
      # the way land/prune_land do. The equivalent guarantee is the pair of
      # checks: every path in every patch here, and every path in the landed diff
      # after the merge — `git am` stages exactly what those checks cleared.
      - name: Authorize the group patches against the report
        run: |
          set -euo pipefail
          mkdir -p patches
          python3 .github/doc-sync/authorize-paths.py expected \
            --report bloat-report.json --lane distill \
            --out "$RUNNER_TEMP/expected-paths.json"
          python3 .github/doc-sync/authorize-paths.py check \
            --expected "$RUNNER_TEMP/expected-paths.json" \
            --patches-dir patches --repo . >/dev/null
      - name: Merge group patches (deterministic — gaps recorded, never silent)
        run: |
          set -euo pipefail
          git config user.name "doc-bloat"
          git config user.email "doc-bloat@users.noreply.github.com"
          git checkout -b doc-bloat/distill
          mkdir -p distill-results patches
          python3 .github/doc-sync/plan-distill.py --merge \
            --manifest distill-manifest.json --results-dir distill-results \
            --patches-dir patches --repo . --out "$RUNNER_TEMP/distill-merge.json"
          python3 .github/doc-sync/render-report.py distill-merge-summary \
            --merge "$RUNNER_TEMP/distill-merge.json"
          # Belt and braces: the landed diff must still be inside the authority —
          # union-resolving a conflict must not smuggle a path past the pre-check.
          git diff --name-only --no-renames "${{ github.sha }}" HEAD > "$RUNNER_TEMP/landed-paths.txt"
          python3 .github/doc-sync/authorize-paths.py check \
            --expected "$RUNNER_TEMP/expected-paths.json" \
            --paths "$RUNNER_TEMP/landed-paths.txt" >/dev/null
      - name: Open draft PR
        run: |
          set -euo pipefail
          DATE=$(date -u +%F)
          python3 .github/doc-sync/sync-gate.py bloat-lane \
            --report bloat-report.json --lane distill --pr-open 0 \
            --out "$RUNNER_TEMP/lane.json" >/dev/null
          python3 .github/doc-sync/render-report.py bloat-pr-body \
            --report "$RUNNER_TEMP/lane.json" \
            --merge "$RUNNER_TEMP/distill-merge.json" > "$RUNNER_TEMP/body.md"
          TITLE=$(python3 .github/doc-sync/render-report.py bloat-pr-title \
            --report "$RUNNER_TEMP/lane.json" --lane distill --date "${DATE}")
          # The branch is exactly the merged per-record commits — nothing is added
          # here (the manifest, report, patches, and sidecars are untracked and
          # stay behind). Nothing landed => skip cleanly, with the merge summary
          # above explaining why.
          if git diff --quiet "${{ github.sha }}" HEAD; then
            python3 .github/doc-sync/render-report.py bloat-skip-summary --lane distill --reason skip-noop
            exit 0
          fi
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" doc-bloat/distill
          PR_URL=$(gh pr create --draft \
            --title "${TITLE}" \
            --body-file "$RUNNER_TEMP/body.md" \
            --head doc-bloat/distill \
            --base "${{ github.ref_name }}")
          python3 .github/doc-sync/render-report.py bloat-pr-summary \
            --report "$RUNNER_TEMP/lane.json" --lane distill --pr-url "${PR_URL}"
