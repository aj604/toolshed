# doc-sync-upgrade — keep the installed doc-sync wiring current with the plugin.
# Installed by the doc-lifecycle plugin's `scheduling-doc-sync` skill; re-run that
# skill to upgrade this file. Preserves .doc-lifecycle/state/sync-marker, audit-scope.json,
# and the install-time knobs. Design: docs/decisions.md's doc-sync self-upgrade
# entry in aj604/toolshed.
#
# Why this exists: the nightly/weekly workflows pin plugin_marketplaces to a
# release tag, so the skills they invoke are frozen at the version the vendored
# wiring was generated from. This workflow is the ONLY thing that advances that
# pin — and `.doc-lifecycle/installed-version` remains the pin, so this YAML is
# byte-identical across versions.
#
# Three jobs, split strictly by trust and by who decides (aj604/toolshed#127).
# Upgrading means running the *target release's* own `apply-upgrade.py`, which no
# one in this repository has reviewed at the moment it runs. Publishing a tag on
# the marketplace is not this repository's decision to execute new code, and a
# version number is not a reviewable artifact — so the schedule detects and a
# human dispatches:
#
#   detect      Scheduled. Compares two version numbers and stops there: nothing
#     is cloned, and none of the release's code runs. When a newer release exists
#     it files one notice issue naming it. `issues: write` is its only write
#     scope, and it is the scope of a notification, not of a change.
#   regenerate  Dispatch only, and the only job that runs the target release's
#     code. It holds `contents: read`, no `GH_TOKEN`, and a checkout that
#     persists no credential. It copies this install's wiring roots into a
#     scratch tree, runs the clone's `apply-upgrade.py` against that copy, and
#     `stage-upgrade.py manifest` reports exactly which paths changed — refusing
#     the whole run if any difference lies outside the wiring the upgrade engine
#     owns. It cannot write to this repository.
#   land        Credentialed, and it executes nothing the release wrote: every
#     byte the release produced reaches it as data inside an artifact. It
#     re-derives the same path authority from the manifest against its own fresh
#     checkout, transfers exactly that path set, stages exactly it, and opens the
#     pull request whose merge is the review.
#
# Both jobs that run wiring scripts copy them out of the work tree first and run
# them from there. The regeneration writes the release's own copies of those very
# scripts, so "run the install's tooling, not the release's" is a claim about
# *when* the copy was taken, not about which directory it sits in.
#
# The lane runs no model at all, so its write scopes never sit behind a model
# process — the 2026-07-07 deterministic-upgrade decision, still binding.
name: doc-sync-upgrade

on:
  schedule:
    - cron: "{{UPGRADE_CRON}}"
  workflow_dispatch:
    inputs:
      target:
        description: "The release to upgrade to, as bare semver (X.Y.Z). Leave blank to only check whether a newer one exists."
        required: false
        default: ""

# Least privilege by default; each job widens only what it needs.
permissions:
  contents: read

concurrency:
  group: doc-sync-upgrade
  cancel-in-progress: false

jobs:
  # Detection only. This job never clones the release and never runs its code, so
  # its one write scope buys a notification and nothing else.
  detect:
    if: inputs.target == ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Resolve versions
        id: versions
        run: |
          set -euo pipefail
          test -f .doc-lifecycle/installed-version || {
            echo "::error::.doc-lifecycle/installed-version missing — run the scheduling-doc-sync installer"; exit 1; }
          CURRENT=$(cat .doc-lifecycle/installed-version)
          # Latest published release of the plugin marketplace (tagName is v-prefixed).
          LATEST=$(gh release view --repo aj604/toolshed --json tagName --jq .tagName | sed 's/^v//')
          {
            echo "current=${CURRENT}"
            echo "latest=${LATEST}"
          } >> "$GITHUB_OUTPUT"

      - name: Gate
        id: gate
        env:
          CURRENT: ${{ steps.versions.outputs.current }}
          LATEST: ${{ steps.versions.outputs.latest }}
        run: |
          set -euo pipefail
          # Semver comparison lives in the tested gate, never in YAML string-fu.
          DECISION=$(python3 .doc-lifecycle/wiring/upgrade-gate.py compare \
            --current "$CURRENT" --latest "$LATEST")
          echo "gate: ${DECISION}"
          echo "decision=${DECISION}" >> "$GITHUB_OUTPUT"
          # current / ahead both self-explain and stop here.
          if [ "${DECISION}" != "upgrade" ]; then
            python3 .doc-lifecycle/wiring/render-report.py upgrade-summary \
              --status "${DECISION}" --current "$CURRENT" --latest "$LATEST"
          fi

      - name: Render the notice
        if: steps.gate.outputs.decision == 'upgrade'
        env:
          CURRENT: ${{ steps.versions.outputs.current }}
          LATEST: ${{ steps.versions.outputs.latest }}
        run: |
          set -euo pipefail
          python3 .doc-lifecycle/wiring/render-report.py upgrade-notice \
            --current "$CURRENT" --latest "$LATEST" \
            --repo "${GITHUB_REPOSITORY}" --workflow doc-sync-upgrade \
            --title-out "${RUNNER_TEMP}/notice-title.txt" \
            --body-out "${RUNNER_TEMP}/notice-body.md"

      # One open notice per release: a weekly check that keeps finding the same
      # unreviewed release keeps quiet rather than filing a duplicate every week.
      # `--limit 200` is the dedupe's reach — past 200 open issues a standing
      # notice can fall off the page and a second one is filed, which is a
      # duplicate issue and never a duplicate upgrade.
      - name: Decide whether to file it
        id: notice
        if: steps.gate.outputs.decision == 'upgrade'
        run: |
          set -euo pipefail
          gh issue list --state open --limit 200 --json number,title \
            > "${RUNNER_TEMP}/open-issues.json"
          python3 .doc-lifecycle/wiring/upgrade-gate.py notice \
            --issues "${RUNNER_TEMP}/open-issues.json" \
            --title "${RUNNER_TEMP}/notice-title.txt" \
            --out "$GITHUB_OUTPUT"

      - name: File the notice
        if: steps.notice.outputs.notice == 'open'
        env:
          CURRENT: ${{ steps.versions.outputs.current }}
          LATEST: ${{ steps.versions.outputs.latest }}
        run: |
          set -euo pipefail
          gh issue create \
            --title "$(cat "${RUNNER_TEMP}/notice-title.txt")" \
            --body-file "${RUNNER_TEMP}/notice-body.md" \
            >> "$GITHUB_STEP_SUMMARY"
          python3 .doc-lifecycle/wiring/render-report.py upgrade-summary \
            --status available --current "$CURRENT" --latest "$LATEST"

      - name: Say the notice already stands
        if: steps.notice.outputs.notice == 'exists'
        env:
          CURRENT: ${{ steps.versions.outputs.current }}
          LATEST: ${{ steps.versions.outputs.latest }}
        run: |
          set -euo pipefail
          python3 .doc-lifecycle/wiring/render-report.py upgrade-summary \
            --status notified --current "$CURRENT" --latest "$LATEST"

  # The only job that runs the target release's code, and it holds nothing: no
  # token, no write scope, no persisted checkout credential.
  regenerate:
    if: inputs.target != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      target: ${{ steps.target.outputs.target }}
      current: ${{ steps.target.outputs.current }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The dispatch input never reaches a shell as a substitution: it travels
      # through `env:` and is re-emitted by the tested gate as strict X.Y.Z, so
      # what names a git ref below is the gate's output, never the raw input. The
      # same gate refuses a downgrade — a dispatch may only move the pin forward.
      - name: Normalize the dispatched target
        id: target
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          test -f .doc-lifecycle/installed-version || {
            echo "::error::.doc-lifecycle/installed-version missing — run the scheduling-doc-sync installer"; exit 1; }
          CURRENT=$(cat .doc-lifecycle/installed-version)
          echo "current=${CURRENT}" >> "$GITHUB_OUTPUT"
          TARGET_CLEAN=$(python3 .doc-lifecycle/wiring/upgrade-gate.py normalize \
            --version "$TARGET" --out "$GITHUB_OUTPUT")
          DECISION=$(python3 .doc-lifecycle/wiring/upgrade-gate.py compare \
            --current "${CURRENT}" --latest "${TARGET_CLEAN}")
          if [ "${DECISION}" != "upgrade" ]; then
            echo "::error::dispatched target ${TARGET_CLEAN} is not newer than the installed ${CURRENT} (gate: ${DECISION}) — this lane advances the pin, it never rewinds it"
            exit 1
          fi

      # Every program this job runs after this point comes from here. The clone's
      # code runs as the runner user and can write anywhere the runner can,
      # `$GITHUB_WORKSPACE` included — so the tooling that decides what it wrote
      # is taken out of the work tree first, while the checkout is still exactly
      # what was reviewed.
      - name: Copy the install's own tooling out of the work tree
        run: |
          set -euo pipefail
          rm -rf "${RUNNER_TEMP}/trusted"
          mkdir -p "${RUNNER_TEMP}/trusted"
          cp .doc-lifecycle/wiring/*.py "${RUNNER_TEMP}/trusted/"

      # Into a scratch copy, never the checkout: the regeneration writes only
      # where this job can afford it to.
      - name: Copy the wiring roots into a scratch tree
        run: |
          set -euo pipefail
          rm -rf "${RUNNER_TEMP}/scratch"
          mkdir -p "${RUNNER_TEMP}/scratch"
          for root in .github .doc-lifecycle; do
            [ -d "${root}" ] || continue
            cp -a "${root}" "${RUNNER_TEMP}/scratch/"
          done

      - name: Check out the target marketplace
        env:
          TARGET: ${{ steps.target.outputs.target }}
        run: |
          set -euo pipefail
          rm -rf "${RUNNER_TEMP}/toolshed-marketplace"
          git clone --depth 1 --branch "v${TARGET}" \
            https://github.com/aj604/toolshed.git "${RUNNER_TEMP}/toolshed-marketplace"

      # The target release's own upgrade logic, run against the scratch copy in a
      # job that can write nothing here. apply-upgrade.py owns which files to lay
      # down and how to preserve state/knobs — never re-implement that as a
      # cp/sed here.
      - name: Regenerate the wiring into the scratch tree
        env:
          TARGET: ${{ steps.target.outputs.target }}
        run: |
          set -euo pipefail
          python3 "${RUNNER_TEMP}/toolshed-marketplace/plugins/doc-lifecycle/skills/scheduling-doc-sync/scripts/apply-upgrade.py" \
            --plugin-root "${RUNNER_TEMP}/toolshed-marketplace/plugins/doc-lifecycle" \
            --repo "${RUNNER_TEMP}/scratch" \
            --target "${TARGET}"

      # Run from the pre-clone copy, so the code drawing the boundary is code a
      # human reviewed. A difference outside the wiring the upgrade engine owns
      # fails here, with every offending path named, and no bundle is produced
      # for the credentialed job to land. `land` re-derives the same authority
      # from its own fresh checkout, so this refusal is the early one, not the
      # only one.
      - name: Report exactly what the regeneration wrote
        env:
          TARGET: ${{ steps.target.outputs.target }}
          CURRENT: ${{ steps.target.outputs.current }}
        run: |
          # No -e: the runner's shell is `bash -e`, and `set -uo pipefail` does
          # not clear that, so the refusal is captured inline with `||` rather
          # than read from a bare `$?` the abort would already have skipped.
          set -uo pipefail
          code=0
          python3 "${RUNNER_TEMP}/trusted/stage-upgrade.py" manifest \
            --scratch "${RUNNER_TEMP}/scratch" --repo . \
            --target "${TARGET}" --bundle "${RUNNER_TEMP}/upgrade-bundle" || code=$?
          # 1 is the authority's own refusal, and the only outcome with something
          # to say on the run surface; 2 is bad input, which fails on the step log
          # rather than claiming the release reached outside the wiring.
          if [ "${code}" -eq 1 ]; then
            python3 "${RUNNER_TEMP}/trusted/render-report.py" upgrade-summary \
              --status refused --current "$CURRENT" --latest "${TARGET}"
          fi
          exit "${code}"

      - name: Upload the regenerated wiring
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: doc-sync-upgrade-bundle
          path: ${{ runner.temp }}/upgrade-bundle
          if-no-files-found: error

  # Credentialed, and it runs none of the release's code. Everything the target
  # release produced arrives as data in an artifact; the authority over which of
  # those paths may be written is re-derived here from the installed checkout.
  land:
    needs: regenerate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Before anything is transferred, and this is the load-bearing step of the
      # whole job: the bundle legitimately carries the target release's own
      # `.doc-lifecycle/wiring/*.py` — `stage-upgrade.py` and `render-report.py`
      # included — so a later step invoking one out of the work tree would be
      # running the release's code with this job's push token, which is exactly
      # what the split exists to prevent. Every program below runs from this
      # copy, taken while the checkout is still only what was reviewed.
      - name: Copy the install's own tooling out of the work tree
        run: |
          set -euo pipefail
          rm -rf "${RUNNER_TEMP}/trusted"
          mkdir -p "${RUNNER_TEMP}/trusted"
          cp .doc-lifecycle/wiring/*.py "${RUNNER_TEMP}/trusted/"

      # An already-open upgrade PR awaits a human — don't stack a second one.
      - name: Refuse to stack on an open upgrade PR
        id: pending
        env:
          CURRENT: ${{ needs.regenerate.outputs.current }}
          TARGET: ${{ needs.regenerate.outputs.target }}
        run: |
          set -euo pipefail
          OPEN_PRS=$(gh pr list --head doc-sync/upgrade --state open --json number --jq length)
          echo "open_prs=${OPEN_PRS}" >> "$GITHUB_OUTPUT"
          if [ "${OPEN_PRS}" -gt 0 ]; then
            PR_URL=$(gh pr list --head doc-sync/upgrade --state open --json url --jq '.[0].url')
            python3 "${RUNNER_TEMP}/trusted/render-report.py" upgrade-summary \
              --status pending --current "$CURRENT" --latest "$TARGET" --pr-url "${PR_URL}"
          fi

      # Into RUNNER_TEMP, never the work tree: the staging check below reads the
      # complete working-tree diff, and a downloaded artifact would be an
      # untracked change it must refuse.
      - name: Download the regenerated wiring
        if: steps.pending.outputs.open_prs == '0'
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: doc-sync-upgrade-bundle
          path: ${{ runner.temp }}/upgrade-bundle

      # `--target` binds the bundle to the version this run was dispatched for;
      # the path authority is re-derived from the manifest rather than taken on
      # the previous job's word, and every bundled file is checked against the
      # digest recorded for it.
      - name: Transfer exactly the paths the manifest names
        if: steps.pending.outputs.open_prs == '0'
        env:
          TARGET: ${{ needs.regenerate.outputs.target }}
        run: |
          set -euo pipefail
          python3 "${RUNNER_TEMP}/trusted/stage-upgrade.py" apply \
            --bundle "${RUNNER_TEMP}/upgrade-bundle" --repo . \
            --target "${TARGET}" --out "${RUNNER_TEMP}/staged-paths.txt" \
            --blocked-status-out "${RUNNER_TEMP}/blocked-status.txt"

      - name: Stage exactly those paths
        if: steps.pending.outputs.open_prs == '0'
        run: |
          set -euo pipefail
          git switch -c doc-sync/upgrade
          git add --pathspec-from-file="${RUNNER_TEMP}/staged-paths.txt" --pathspec-file-nul
          git diff --cached --name-only -z --no-renames > "${RUNNER_TEMP}/staged.txt"
          { git diff --name-only -z; \
            git ls-files --others --exclude-standard -z; } \
            > "${RUNNER_TEMP}/unstaged.txt"
          python3 "${RUNNER_TEMP}/trusted/stage-upgrade.py" verify \
            --paths "${RUNNER_TEMP}/staged-paths.txt" \
            --staged "${RUNNER_TEMP}/staged.txt" \
            --unstaged "${RUNNER_TEMP}/unstaged.txt"

      - name: Open the upgrade pull request
        if: steps.pending.outputs.open_prs == '0'
        env:
          CURRENT: ${{ needs.regenerate.outputs.current }}
          TARGET: ${{ needs.regenerate.outputs.target }}
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then
            # Version advanced but the regenerated wiring is byte-identical — nothing to land.
            python3 "${RUNNER_TEMP}/trusted/render-report.py" upgrade-summary \
              --status noop --current "$CURRENT" --latest "$TARGET"
            exit 0
          fi
          CHANGED=$(git diff --cached --name-only | paste -sd, -)
          # The Actions GITHUB_TOKEN cannot push files under .github/workflows/ — GitHub
          # blocks it, and the `workflows` permission is not grantable to it. Version-only
          # upgrades don't touch those files (the pin is read from installed-version at
          # runtime), so the push below succeeds. But an upgrade that changes the workflow
          # TEMPLATES themselves can't land automatically — emit the diff as a patch
          # artifact and fail loud with apply instructions, not a cryptic push rejection.
          #
          # The staged diff, so a one-time relocation's patch carries its newly created
          # files and not only the deletions (aj604/toolshed#133). Which of the two
          # blocked statuses this is was decided by the path authority, from the change
          # set it authorized — a summary that says "your install moved" is not something
          # to derive by grepping paths in YAML.
          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            git diff --cached > "$RUNNER_TEMP/doc-sync-upgrade.patch"
            python3 "${RUNNER_TEMP}/trusted/render-report.py" upgrade-summary \
              --status "$(cat "${RUNNER_TEMP}/blocked-status.txt")" --current "$CURRENT" \
              --latest "$TARGET" --files "${CHANGED}"
            exit 1
          fi
          python3 "${RUNNER_TEMP}/trusted/render-report.py" upgrade-pr-body \
            --current "$CURRENT" --latest "$TARGET" \
            --files "${CHANGED}" > "$RUNNER_TEMP/upgrade-pr-body.md"
          git config user.name "doc-sync"
          git config user.email "doc-sync@users.noreply.github.com"
          git commit -m "docs: upgrade doc-sync wiring to plugin v${TARGET}"
          # --force: a closed-unmerged PR can leave a stale branch behind.
          git push --force origin HEAD:refs/heads/doc-sync/upgrade
          PR_URL=$(gh pr create \
            --title "docs: upgrade doc-sync wiring to plugin v${TARGET}" \
            --body-file "$RUNNER_TEMP/upgrade-pr-body.md" \
            --head doc-sync/upgrade \
            --base "${{ github.ref_name }}")
          python3 "${RUNNER_TEMP}/trusted/render-report.py" upgrade-summary \
            --status opened --current "$CURRENT" --latest "$TARGET" --pr-url "${PR_URL}"

      # When the upgrade regenerated workflow files, the step above wrote the diff here
      # and failed loud (the token can't push .github/workflows/); publish it so a human
      # can apply it locally. No-op for the common version-only upgrade (no patch file).
      - name: Upload upgrade patch (manual apply for workflow-file changes)
        if: always() && steps.pending.outputs.open_prs == '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: doc-sync-upgrade-patch
          path: ${{ runner.temp }}/doc-sync-upgrade.patch
          if-no-files-found: ignore
